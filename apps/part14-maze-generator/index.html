<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自動迷路ジェネレーター</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">Part 14</p>
      <h1>自動迷路ジェネレーター</h1>
      <p class="lead">サイズと難易度を選んで、新しい迷路を生成できます。</p>
    </header>

    <section class="panel controls-panel" aria-labelledby="settings-heading">
      <h2 id="settings-heading">設定</h2>
      <div class="fields">
        <div class="field">
          <label for="maze-size">サイズ</label>
          <select id="maze-size">
            <option value="10">小（10×10）</option>
            <option value="20" selected>中（20×20）</option>
            <option value="30">大（30×30）</option>
          </select>
        </div>
        <div class="field">
          <label for="difficulty">難易度</label>
          <select id="difficulty">
            <option value="easy">かんたん</option>
            <option value="normal" selected>ふつう</option>
            <option value="hard">むずかしい</option>
          </select>
        </div>
      </div>
      <button id="generate-button" type="button">新しい迷路を生成</button>
    </section>

    <section class="panel maze-panel" aria-labelledby="maze-heading">
      <h2 id="maze-heading">迷路</h2>
      <div id="canvas-container" class="canvas-container">
        <canvas id="maze-canvas" aria-label="生成された迷路"></canvas>
      </div>
      <p id="generation-status" class="visually-hidden" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
