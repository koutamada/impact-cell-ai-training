<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イベント日数カウンター</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>イベント日数カウンター</h1>

    <section class="panel form-panel" aria-labelledby="form-title">
      <h2 id="form-title">イベントを登録</h2>
      <form id="event-form" novalidate>
        <div class="field">
          <label for="event-name">イベント名</label>
          <input id="event-name" name="event-name" type="text" autocomplete="off" aria-describedby="form-error">
        </div>
        <div class="field">
          <label for="event-date">目標日</label>
          <input id="event-date" name="event-date" type="date" aria-describedby="form-error">
        </div>
        <p id="form-error" class="message error-message" role="alert" aria-atomic="true"></p>
        <div class="form-actions">
          <button id="submit-button" class="button primary-button" type="submit">登録する</button>
          <button id="cancel-button" class="button secondary-button" type="button" hidden>キャンセル</button>
        </div>
      </form>
    </section>

    <section class="panel list-panel" aria-labelledby="list-title">
      <h2 id="list-title">登録したイベント（0件）</h2>
      <p id="empty-message" class="empty-message">登録したイベントはまだありません</p>
      <ul id="event-list" class="event-list" hidden></ul>
    </section>

    <p id="notification" class="message notification" role="alert" aria-atomic="true"></p>
  </main>
</body>
</html>
