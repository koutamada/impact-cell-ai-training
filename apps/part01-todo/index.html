<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスク管理</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header><h1>タスク管理</h1></header>
      <label for="task-input">新しいタスク</label>
      <div class="input-area">
        <input id="task-input" type="text" placeholder="タスクを入力" autocomplete="off">
        <button id="add-button" type="button">追加</button>
      </div>
      <ul id="task-list" aria-label="タスク一覧"></ul>
      <p id="empty-message">タスクはまだありません。</p>
    </main>
  </body>
</html>
