<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タイマー＆ストップウォッチ</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <h1>タイマー＆ストップウォッチ</h1>
      <div class="tabs" role="group" aria-label="計測機能の切替">
        <button id="timer-tab" type="button" aria-pressed="true" aria-controls="timer-panel">タイマー</button>
        <button id="stopwatch-tab" type="button" aria-pressed="false" aria-controls="stopwatch-panel">ストップウォッチ</button>
      </div>

      <section id="timer-panel" aria-labelledby="timer-tab" data-state="stopped">
        <p id="timer-state" class="state">停止中</p>
        <p id="timer-caption" class="time-caption">残り時間</p>
        <p id="timer-display" class="time" role="timer" aria-labelledby="timer-caption">00:05:00</p>
        <div class="settings" role="group" aria-label="タイマーの設定時間">
          <label for="hours">時<input id="hours" type="number" inputmode="numeric" min="0" max="99" step="1" value="0" autocomplete="off"></label>
          <label for="minutes">分<input id="minutes" type="number" inputmode="numeric" min="0" max="59" step="1" value="5" autocomplete="off"></label>
          <label for="seconds">秒<input id="seconds" type="number" inputmode="numeric" min="0" max="59" step="1" value="0" autocomplete="off"></label>
        </div>
        <div class="actions">
          <button id="timer-start" class="primary" type="button">開始</button>
          <button id="timer-pause" type="button" disabled>一時停止</button>
          <button id="timer-reset" type="button">リセット</button>
        </div>
        <p id="timer-message" class="message" aria-live="assertive" aria-atomic="true"></p>
      </section>

      <section id="stopwatch-panel" aria-labelledby="stopwatch-tab" data-state="stopped" hidden>
        <p id="stopwatch-state" class="state">停止中</p>
        <p id="stopwatch-caption" class="time-caption">経過時間</p>
        <p id="stopwatch-display" class="time stopwatch-time" role="timer" aria-labelledby="stopwatch-caption">00:00:00.00</p>
        <div class="actions">
          <button id="stopwatch-start" class="primary" type="button">開始</button>
          <button id="stopwatch-pause" type="button" disabled>一時停止</button>
          <button id="stopwatch-reset" type="button" disabled>リセット</button>
        </div>
      </section>
    </main>
  </body>
</html>
